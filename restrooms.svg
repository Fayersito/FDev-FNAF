<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- Fondo y Azulejos -->
  <rect width="1000" height="600" fill="#121619"/>
  <path d="M 0 0 L 250 120 L 250 480 L 0 600 Z" fill="#182026" stroke="#0d1317" stroke-width="2"/>
  <path d="M 1000 0 L 750 120 L 750 480 L 1000 600 Z" fill="#182026" stroke="#0d1317" stroke-width="2"/>
  <polygon points="250,120 750,120 750,480 250,480" fill="#202a30" stroke="#0d1317" stroke-width="2"/>
  <polygon points="0,600 250,480 750,480 1000,600" fill="#0a0d0f"/>

  <!-- Líneas de azulejos en pared de fondo -->
  <line x1="250" y1="200" x2="750" y2="200" stroke="#2c3a42" stroke-width="1"/>
  <line x1="250" y1="280" x2="750" y2="280" stroke="#2c3a42" stroke-width="1"/>
  <line x1="250" y1="360" x2="750" y2="360" stroke="#2c3a42" stroke-width="1"/>

  <!-- Puertas de los Cubículos -->
  <rect x="290" y="180" width="120" height="260" fill="#31251e" stroke="#1a130f" stroke-width="4"/>
  <rect x="440" y="180" width="120" height="260" fill="#31251e" stroke="#1a130f" stroke-width="4"/>
  <circle cx="305" cy="310" r="4" fill="#888"/>
  <circle cx="455" cy="310" r="4" fill="#888"/>

  <!-- Carteles de Baño (Chicos / Chicas) -->
  <rect x="620" y="200" width="80" height="50" fill="#111" stroke="#fff" stroke-width="1"/>
  <circle cx="645" cy="220" r="6" fill="#fff"/>
  <path d="M 645 226 L 640 240 L 650 240 Z" fill="#fff"/>
  <circle cx="675" cy="220" r="6" fill="#fff"/>
  <rect x="671" y="226" width="8" height="14" fill="#fff"/>

  <!-- Espejo y Lavabo -->
  <rect x="610" y="280" width="100" height="80" fill="#455a64" stroke="#263238" stroke-width="3"/>
  <ellipse cx="660" cy="400" rx="35" ry="15" fill="#cfd8dc" stroke="#37474f" stroke-width="3"/>
</svg>
