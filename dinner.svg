<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="wall-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090c" />
      <stop offset="100%" stop-color="#141720" />
    </linearGradient>
    <radialGradient id="dim-light" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a251a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </radialGradient>
  </defs>

  <!-- Pared del fondo -->
  <rect width="1000" height="380" fill="url(#wall-grad)" />

  <!-- Borde decorativo de azulejos en la pared -->
  <rect y="320" width="1000" height="40" fill="#1e0f12" stroke="#331419" stroke-width="2" />
  <path d="M 0,340 L 1000,340" stroke="#000" stroke-width="2" />

  <!-- Suelo -->
  <polygon points="0,380 1000,380 1000,600 0,600" fill="#0a0a0d" />
  <path d="M 0,380 L 1000,380 M 0,430 L 1000,430 M 0,490 L 1000,490 M 0,550 L 1000,550" stroke="#12131a" stroke-width="2" />
  <path d="M 150,380 L 50,600 M 350,380 L 300,600 M 550,380 L 550,600 M 750,380 L 800,600 M 900,380 L 1000,520" stroke="#12131a" stroke-width="2" />

  <!-- MESAS DE COMEDOR (Perspectiva) -->
  <!-- Mesa Izquierda -->
  <polygon points="100,420 380,420 420,580 50,580" fill="#101217" stroke="#222633" stroke-width="2" />
  <!-- Mantel -->
  <polygon points="110,420 370,420 405,560 65,560" fill="#181c24" />
  
  <!-- Mesa Derecha -->
  <polygon points="620,420 900,420 950,580 580,580" fill="#101217" stroke="#222633" stroke-width="2" />
  <!-- Mantel -->
  <polygon points="630,420 890,420 935,560 595,560" fill="#181c24" />

  <!-- Gorritos de fiesta sobre las mesas -->
  <!-- Gorro 1 -->
  <polygon points="200,450 215,420 230,450" fill="#8b1e1e" />
  <circle cx="215" cy="420" r="3" fill="#ffcc00" />
  <!-- Gorro 2 -->
  <polygon points="280,460 295,430 310,460" fill="#1e4b8b" />
  <circle cx="295" cy="430" r="3" fill="#ffffff" />
  <!-- Gorro 3 -->
  <polygon points="700,450 715,420 730,450" fill="#1e8b3b" />
  <circle cx="715" cy="420" r="3" fill="#ff0055" />

  <!-- Sillas en sombra -->
  <rect x="130" y="390" width="40" height="30" fill="#08080a" stroke="#15161c" />
  <rect x="310" y="390" width="40" height="30" fill="#08080a" stroke="#15161c" />
  <rect x="650" y="390" width="40" height="30" fill="#08080a" stroke="#15161c" />
  <rect x="830" y="390" width="40" height="30" fill="#08080a" stroke="#15161c" />

  <!-- Iluminación y sombras -->
  <rect width="1000" height="600" fill="url(#dim-light)" />

  <!-- Nombre de la Cámara en pantalla -->
  <rect x="40" y="40" width="180" height="35" fill="#050508" stroke="#1c1e29" stroke-width="2" rx="3" />
  <text x="130" y="63" fill="#3a3e52" font-family="'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="middle">CAM 1B - DINING</text>

  <!-- Lineas de escaneo CRT -->
  <path d="M 0,30 L 1000,30 M 0,90 L 1000,90 M 0,150 L 1000,150 M 0,210 L 1000,210 M 0,270 L 1000,270 M 0,330 L 1000,330 M 0,390 L 1000,390 M 0,450 L 1000,450 M 0,510 L 1000,510 M 0,570 L 1000,570" stroke="#ffffff" stroke-width="1" opacity="0.03" />
</svg>
