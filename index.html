<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>FDev-FNAF</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        :root {
            --bg: #000;
            --panel: rgba(0, 0, 0, 0.7);
            --green: #00ff6a;
            --red: #ff2d2d;
            --amber: #ffcc00;
            --border: #555;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        button {
            font-family: inherit;
        }

        button:focus-visible,
        .btn-door:focus-visible,
        .btn-light:focus-visible,
        .cam-btn:focus-visible {
            outline: 3px solid var(--amber);
            outline-offset: 2px;
        }

        /* ENVOLTORIO RESPONSIVE: escala el tablero de 1000x600 a cualquier pantalla */
        #game-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1000px;
            height: 600px;
            background-color: #000;
            border: 4px solid #333;
            overflow: hidden;
            transform-origin: center center;
            flex-shrink: 0;
        }

        /* MENÚS Y PANTALLAS */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        h1 { font-size: 3rem; margin-bottom: 20px; text-shadow: 0 0 10px #f00; letter-spacing: 2px; }
        h2 { font-size: 2rem; margin-bottom: 10px; }

        .menu-eyebrow {
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #999;
            font-weight: normal;
            margin-bottom: 4px;
        }

        /* PANTALLA DE TÍTULO CON FONDO PROPIO */
        #main-menu {
            background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.8)), url('start.png') no-repeat center center;
            background-size: cover;
        }
        .subtitle { color: #999; font-size: 1rem; margin-bottom: 20px; letter-spacing: 1px; }

        button.menu-btn {
            background: #222;
            color: #fff;
            border: 2px solid #fff;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            margin: 10px;
            transition: 0.15s;
        }

        button.menu-btn:hover {
            background: #fff;
            color: #000;
        }

        button.menu-btn.secondary {
            border-color: var(--border);
            color: #ccc;
        }

        button.menu-btn.secondary:hover {
            background: #333;
            color: #fff;
        }

        button.menu-btn.danger { border-color: var(--red); color: var(--red); }
        button.menu-btn.danger:hover { background: var(--red); color: #000; }

        .hint-text {
            position: absolute;
            bottom: 18px;
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 1px;
        }

        /* PANTALLA DE OPCIONES */
        #settings-screen .settings-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 14px 0;
            font-size: 1rem;
        }

        #settings-screen input[type="range"] {
            width: 220px;
            accent-color: var(--green);
        }

        /* OFICINA CON FONDO SVG CLARO */
        #office {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('office.svg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 30px;
        }

        /* EASTER EGG POSTER */
        #easter-egg-poster {
            position: absolute;
            top: 75px;
            left: 425px;
            width: 150px;
            height: 90px;
            cursor: pointer;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--amber);
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
            background: rgba(0,0,0,0.5);
            overflow: hidden;
        }

        #easter-egg-poster img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        /* MARCO DE LAS PUERTAS */
        .door-view {
            position: relative;
            width: 250px;
            height: 480px;
            border: 8px solid #777;
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .door-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            pointer-events: none;
            transition: background 0.1s;
            z-index: 1;
        }

        .door-overlay.lit {
            background: rgba(255, 255, 200, 0.08);
        }

        .door-view.closed {
            background: #222;
            border-color: #111;
        }

        .door-view.closed .door-overlay {
            display: none;
        }

        /* REGULACIÓN DE TAMAÑOS DE ENEMIGOS EN PUERTAS (por atributo data-size, no por nombre de archivo) */
        .door-view img.enemy-sprite {
            object-fit: contain;
            display: none;
            z-index: 2;
            transition: transform 0.1s ease-out;
        }

        .door-view img.enemy-sprite[data-size="big"] {
            height: 100%;
            max-width: 100%;
            transform: scale(1.08);
        }

        .door-view img.enemy-sprite[data-size="small"] {
            height: 82%;
            max-width: 82%;
        }

        /* PANELES DE BOTONES */
        .door-control-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 5;
            background: var(--panel);
            padding: 10px;
            border-radius: 5px;
        }

        .btn-door-wrapper, .btn-light-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .btn-door-wrapper label { color: var(--green); font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; }
        .btn-light-wrapper label { color: #ffffff; font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; }

        .btn-door {
            width: 45px;
            height: 70px;
            background: transparent;
            border: 4px solid var(--green);
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-door.active { background: var(--green); box-shadow: 0 0 10px var(--green); }
        .btn-door[disabled] { opacity: 0.35; cursor: not-allowed; }

        .btn-light {
            width: 35px;
            height: 35px;
            background: transparent;
            border: 4px solid #ffffff;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-light.active { background: #ffffff; box-shadow: 0 0 10px #ffffff; }
        .btn-light[disabled] { opacity: 0.35; cursor: not-allowed; }

        /* HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 1.5rem;
            z-index: 30;
            text-shadow: 2px 2px #000;
        }

        #hud .hud-block { pointer-events: none; }

        #power-bar-track {
            width: 160px;
            height: 8px;
            border: 1px solid #666;
            margin-top: 6px;
            background: #111;
        }

        #power-bar-fill {
            height: 100%;
            width: 100%;
            background: var(--green);
            transition: width 0.3s, background 0.3s;
        }

        #hud-controls {
            display: flex;
            gap: 8px;
            pointer-events: all;
        }

        .icon-btn {
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 2px solid #999;
            width: 34px;
            height: 34px;
            font-size: 1rem;
            cursor: pointer;
            line-height: 1;
        }
        .icon-btn:hover { border-color: #fff; }

        /* CÁMARAS Y MONITOR */
        #tablet-toggle {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 8px 40px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border: 2px solid #fff;
            cursor: pointer;
            font-family: inherit;
        }

        #camera-system {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            background-position: center;
            background-size: cover;
            display: none;
            z-index: 15;
        }

        #camera-display {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #camera-display img {
            object-fit: contain;
        }

        #camera-display img[data-size="big"] {
            max-height: 85%;
            max-width: 85%;
        }

        #camera-display img[data-size="small"] {
            max-height: 72%;
            max-width: 72%;
        }

        #audio-only-msg {
            display: none;
            color: var(--red);
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #000;
        }

        /* MAPA AMPLIADO CON MÁS SALAS */
        #map-container {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 320px;
            height: 250px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #555;
            padding: 5px;
        }

        #map-layout { position: relative; width: 100%; height: 100%; }

        .map-room {
            position: absolute;
            border: 1px dashed #666;
            font-size: 0.55rem;
            color: #aaa;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 2px;
            text-align: center;
        }

        /* POSICIONAMIENTO DE LAS SALAS EN EL MAPA */
        #room-1a { top: 0px; left: 110px; width: 100px; height: 35px; }
        #room-1b { top: 40px; left: 100px; width: 120px; height: 50px; }
        #room-1c { top: 40px; left: 20px; width: 70px; height: 45px; } /* Partes y Servicios */
        #room-c1 { top: 40px; right: 20px; width: 70px; height: 45px; } /* Baños */
        #room-2a { top: 100px; left: 80px; width: 50px; height: 60px; }
        #room-2b { top: 100px; right: 80px; width: 50px; height: 60px; }
        #room-2p { top: 100px; left: 10px; width: 60px; height: 50px; } /* Pirate Cove */
        #room-c2 { top: 100px; right: 10px; width: 60px; height: 50px; } /* Cocina */
        #room-you { bottom: 5px; left: 130px; width: 60px; height: 35px; border: 1px solid #0f0; color: #0f0; }

        .cam-btn {
            position: absolute;
            font-size: 0.6rem;
            padding: 2px 4px;
            margin: 0;
            background: #222;
            border: 1px solid #fff;
            color: #fff;
            z-index: 2;
            cursor: pointer;
        }

        .cam-btn.active { background: #0f0; color: #000; font-weight: bold; }
        .cam-btn.has-activity::after {
            content: '';
            position: absolute;
            top: -3px;
            right: -3px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 4px var(--red);
        }

        /* BOTONES DE CÁMARAS */
        #btn-1a { top: 5px; left: 140px; }
        #btn-1b { top: 50px; left: 140px; }
        #btn-1c { top: 50px; left: 35px; }
        #btn-c1 { top: 50px; right: 35px; }
        #btn-2a { top: 110px; left: 85px; }
        #btn-2b { top: 110px; right: 85px; }
        #btn-2p { top: 110px; left: 20px; }
        #btn-c2 { top: 110px; right: 20px; }

        /* ESTÁTICA CRT Y TRANSICIÓN DE CÁMARA */
        .static-effect {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.2) 2px);
            pointer-events: none;
            z-index: 4;
        }

        #cam-static-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8), rgba(0,0,0,0.9) 1px);
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            transition: opacity 0.05s;
        }

        #cam-static-flash.active {
            opacity: 0.75;
        }

        /* PAUSA */
        #pause-screen { z-index: 150; background: rgba(0,0,0,0.9); display: none; }

        /* JUMPSCARE */
        #jumpscare {
            background: #000;
            z-index: 200;
            display: none;
        }

        #jumpscare img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(10px, -10px); }
            50% { transform: translate(-10px, 10px); }
            75% { transform: translate(10px, 10px); }
            100% { transform: translate(-10px, -10px); }
        }

        @media (prefers-reduced-motion: reduce) {
            #jumpscare img { animation: none; }
            #cam-static-flash { transition: none; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
    <div id="game-container">
        <!-- MENÚ PRINCIPAL -->
        <div id="main-menu" class="screen">
            <div class="menu-eyebrow">FDev Presenta...</div>
            <h1>FIVE NIGHTS AT FRIKILAND</h1>
            <button class="menu-btn" onclick="startGame()">NUEVA PARTIDA</button>
            <button class="menu-btn secondary" onclick="openSettings('main-menu')">OPCIONES</button>
            <div class="hint-text">Teclas: 1-8 cámaras · A/D puertas · Q/E luces · TAB monitor · ESC pausa</div>
        </div>

        <!-- OPCIONES -->
        <div id="settings-screen" class="screen" style="display: none;">
            <h2>OPCIONES</h2>
            <div class="settings-row">
                <label for="volume-slider">Volumen</label>
                <input type="range" id="volume-slider" min="0" max="100" value="70" oninput="setVolume(this.value)">
                <span id="volume-value">70%</span>
            </div>
            <button class="menu-btn" onclick="closeSettings()">VOLVER</button>
        </div>

        <!-- TRANSICIÓN DE NOCHE -->
        <div id="night-screen" class="screen" style="display: none;">
            <h2 id="night-title">NOCHE 1</h2>
            <div id="night-subtitle" class="subtitle"></div>
            <button class="menu-btn" onclick="startNight()">INICIAR NOCHE</button>
        </div>

        <!-- PAUSA -->
        <div id="pause-screen" class="screen">
            <h2>PAUSA</h2>
            <button class="menu-btn" onclick="togglePause()">CONTINUAR</button>
            <button class="menu-btn secondary" onclick="openSettings('pause-screen')">OPCIONES</button>
            <button class="menu-btn danger" onclick="showMainMenu()">SALIR AL MENÚ</button>
        </div>

        <!-- PANTALLA GAME OVER / VICTORIA -->
        <div id="end-screen" class="screen" style="display: none;">
            <h1 id="end-title">GAME OVER</h1>
            <div id="end-subtitle" class="subtitle"></div>
            <button id="retry-btn" class="menu-btn" onclick="retryNight()" style="display: none;">REINTENTAR NOCHE</button>
            <button class="menu-btn secondary" onclick="showMainMenu()">MENÚ PRINCIPAL</button>
        </div>

        <!-- JUMPSCARE -->
        <div id="jumpscare" class="screen">
            <img id="jumpscare-img" src="" alt="Jumpscare">
        </div>

        <!-- HUD -->
        <div id="hud">
            <div class="hud-block">
                <div>ENERGÍA: <span id="power-display">100%</span></div>
                <div id="power-bar-track"><div id="power-bar-fill"></div></div>
            </div>
            <div id="hud-controls">
                <button class="icon-btn" onclick="setVolume(masterVolume > 0 ? 0 : 70)" id="mute-btn" title="Silenciar" aria-label="Silenciar">🔊</button>
                <button class="icon-btn" onclick="togglePause()" title="Pausa" aria-label="Pausa">⏸</button>
            </div>
            <div class="hud-block" style="text-align:right;">HORA: <span id="time-display">12 AM</span></div>
        </div>

        <!-- OFICINA DE JUEGO -->
        <div id="office">
            <!-- EASTER EGG CARTEL -->
            <div id="easter-egg-poster" onclick="triggerEasterEgg()" title="Celebrar" role="button" tabindex="0" aria-label="Cartel secreto">
                <img src="img.png" alt="Poster Freddy">
            </div>

            <div id="left-door-view" class="door-view">
                <div id="left-door-overlay" class="door-overlay"></div>
                <img id="left-enemy-img" class="enemy-sprite" src="" alt="Enemigo">
            </div>
            
            <div class="door-control-panel">
                <div class="btn-door-wrapper">
                    <label>PUERTA</label>
                    <div id="btn-door-left" class="btn-door" onclick="toggleDoor('left')" role="button" tabindex="0" aria-label="Puerta izquierda"></div>
                </div>
                <div class="btn-light-wrapper">
                    <div id="btn-light-left" class="btn-light" onmousedown="handleLight(true, 'left')" onmouseup="handleLight(false, 'left')" onmouseleave="handleLight(false, 'left')" ontouchstart="handleLight(true, 'left')" ontouchend="handleLight(false, 'left')" role="button" tabindex="0" aria-label="Luz izquierda"></div>
                    <label>LUZ</label>
                </div>
            </div>

            <div class="door-control-panel">
                <div class="btn-door-wrapper">
                    <label>PUERTA</label>
                    <div id="btn-door-right" class="btn-door" onclick="toggleDoor('right')" role="button" tabindex="0" aria-label="Puerta derecha"></div>
                </div>
                <div class="btn-light-wrapper">
                    <div id="btn-light-right" class="btn-light" onmousedown="handleLight(true, 'right')" onmouseup="handleLight(false, 'right')" onmouseleave="handleLight(false, 'right')" ontouchstart="handleLight(true, 'right')" ontouchend="handleLight(false, 'right')" role="button" tabindex="0" aria-label="Luz derecha"></div>
                    <label>LUZ</label>
                </div>
            </div>

            <div id="right-door-view" class="door-view">
                <div id="right-door-overlay" class="door-overlay"></div>
                <img id="right-enemy-img" class="enemy-sprite" src="" alt="Enemigo">
            </div>
        </div>

        <!-- CÁMARAS -->
        <div id="camera-system">
            <div class="static-effect"></div>
            <div id="cam-static-flash"></div>
            <div id="camera-display">
                <h3 id="cam-name" style="position: absolute; top: 20px; left: 20px; z-index: 5;">CAM 1A</h3>
                <div id="audio-only-msg">- SOLO AUDIO -</div>
                <img id="cam-enemy-img" src="" alt="Enemigo en cámara" style="display: none;">
            </div>

            <div id="map-container">
                <div id="map-layout">
                    <div id="room-1a" class="map-room">1A</div>
                    <div id="room-1b" class="map-room">1B</div>
                    <div id="room-1c" class="map-room">1C</div>
                    <div id="room-c1" class="map-room">C1</div>
                    <div id="room-2a" class="map-room">2A</div>
                    <div id="room-2b" class="map-room">2B</div>
                    <div id="room-2p" class="map-room">2P</div>
                    <div id="room-c2" class="map-room">C2</div>
                    <div id="room-you" class="map-room">TÚ</div>

                    <button id="btn-1a" class="cam-btn active" onclick="changeCam('1A')">1A</button>
                    <button id="btn-1b" class="cam-btn" onclick="changeCam('1B')">1B</button>
                    <button id="btn-1c" class="cam-btn" onclick="changeCam('1C')">1C</button>
                    <button id="btn-c1" class="cam-btn" onclick="changeCam('C1')">C1</button>
                    <button id="btn-2a" class="cam-btn" onclick="changeCam('2A')">2A</button>
                    <button id="btn-2b" class="cam-btn" onclick="changeCam('2B')">2B</button>
                    <button id="btn-2p" class="cam-btn" onclick="changeCam('2P')">2P</button>
                    <button id="btn-c2" class="cam-btn" onclick="changeCam('C2')">C2</button>
                </div>
            </div>
        </div>

        <button id="tablet-toggle" onclick="toggleTablet()">MONITOR</button>
    </div>
    </div>

    <script>
        // --- EFECTOS DE SONIDO SINTETIZADOS ---
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        }

        function playDoorSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.3 * masterVolume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playLightSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05 * masterVolume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playClickSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(650, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.25 * masterVolume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // --- AUDIOS DEL JUEGO Y MUESTRAS MP3 ---
        const bgAudio = new Audio('back.mp3');
        bgAudio.loop = true;
        const BG_BASE_VOL = 0.15;

        // Música de fondo de la pantalla de título, siempre a volumen bajo
        const titleAudio = new Audio('parodia.mp3');
        titleAudio.loop = true;
        const TITLE_BASE_VOL = 0.18;

        const sorpresaAudio = new Audio('sorpresa.mp3');
        const openAudio = new Audio('open.mp3');
        const closeAudio = new Audio('close.mp3');
        const changeAudio = new Audio('change.mp3');
        const cocinaAudio = new Audio('cocina.mp3');
        cocinaAudio.loop = true;

        const audio1 = new Audio('ost.mp3');
        const audio2 = new Audio('ost2.mp3');
        const audio3 = new Audio('ost3.mp3');

        // Volumen maestro (0 a 1), persistido en localStorage
        let masterVolume = 0.7;
        const allGameAudio = [bgAudio, titleAudio, sorpresaAudio, openAudio, closeAudio, changeAudio, cocinaAudio, audio1, audio2, audio3];

        function applyVolume() {
            bgAudio.volume = BG_BASE_VOL * masterVolume;
            titleAudio.volume = TITLE_BASE_VOL * masterVolume;
            [sorpresaAudio, openAudio, closeAudio, changeAudio, cocinaAudio, audio1, audio2, audio3].forEach(a => {
                a.volume = masterVolume;
            });
        }

        function setVolume(value) {
            masterVolume = Math.min(100, Math.max(0, Number(value))) / 100;
            applyVolume();
            localStorage.setItem('fnafhtml_volume', String(Math.round(masterVolume * 100)));
            const slider = document.getElementById('volume-slider');
            if (slider) slider.value = Math.round(masterVolume * 100);
            const label = document.getElementById('volume-value');
            if (label) label.innerText = `${Math.round(masterVolume * 100)}%`;
            const muteBtn = document.getElementById('mute-btn');
            if (muteBtn) muteBtn.innerText = masterVolume === 0 ? '🔇' : '🔊';
        }

        (function loadVolume() {
            const saved = localStorage.getItem('fnafhtml_volume');
            setVolume(saved !== null ? saved : 70);
        })();

        let settingsReturnScreen = 'main-menu';
        function openSettings(fromScreen) {
            settingsReturnScreen = fromScreen;
            document.getElementById(fromScreen).style.display = 'none';
            document.getElementById('settings-screen').style.display = 'flex';
        }
        function closeSettings() {
            document.getElementById('settings-screen').style.display = 'none';
            document.getElementById(settingsReturnScreen).style.display = 'flex';
        }

        // FONDOS SVG ASOCIADOS A CADA CÁMARA
        const camBackgrounds = {
            '1A': 'stage.svg',
            '1B': 'dinner.svg',
            '1C': 'parts.svg',
            'C1': 'restrooms.svg',
            '2A': 'pasillo1.svg',
            '2B': 'pasillo2.svg',
            '2P': 'pirate.svg',
            'C2': ''
        };

        const CAM_LIST = ['1A', '1B', '1C', 'C1', '2A', '2B', '2P', 'C2'];

        let currentNight = 1;
        let power = 100;
        let gameTime = 0;
        let currentCam = '1A';
        let isTabletOpen = false;
        let isFlashlightOn = false;
        let activeLightSide = null;
        let lastSpottedEnemy = false;
        let isPaused = false;
        let nightActive = false;
        let lastNightResult = null; // 'over' | 'won' | null

        let doors = { left: false, right: false };
        let gameIntervals = [];

        // Cada animatronic define su tamaño de sprite ('big'/'small') en vez de depender
        // del nombre de archivo, para que el CSS no dependa de nombres frágiles.
        //
        // Como en el FNAF original, cada personaje tiene su PROPIO recorrido fijo de salas
        // (no un mapa genérico compartido): avanza sala por sala de su "path" según su IA,
        // y solo puede colarse por la puerta a la que pertenece al llegar al final del camino.
        const animatronics = [
            {
                id: 1, name: 'Img1', sprite: 'img.png', size: 'big', audio: audio1,
                door: 'left',
                path: ['1A', '1B', 'C1', '2A', 'DOOR'], // escenario -> comedor -> baños -> pasillo -> puerta izquierda
            },
            {
                id: 2, name: 'Img2', sprite: 'img2.png', size: 'small', audio: audio2,
                door: 'right',
                path: ['1A', '1B', 'C1', 'C2', '2B', 'DOOR'], // escenario -> comedor -> baños -> cocina -> pasillo -> puerta derecha
            },
            {
                id: 3, name: 'Img3', sprite: 'img3.png', size: 'small', audio: audio3,
                door: 'left',
                path: ['1B', '1C', '2P', '2A', 'DOOR'], // comedor -> partes y servicio -> cala pirata -> pasillo -> puerta izquierda
            }
        ].map(a => ({
            ...a,
            home: a.path[0],
            location: a.path[0],
            pathIndex: 0,
            ai: 0,
            doorTime: 0,
            idleTicks: 0
        }));

        function triggerEasterEgg() {
            const easterAudio = new Audio('ost.mp3');
            easterAudio.volume = 0.25 * masterVolume;
            easterAudio.play().catch(() => {});
        }

        function triggerStaticFlash() {
            const flash = document.getElementById('cam-static-flash');
            flash.classList.add('active');
            setTimeout(() => {
                flash.classList.remove('active');
            }, 500);
        }

        function playTitleMusic() {
            titleAudio.play().catch(() => {});
        }

        function stopTitleMusic() {
            titleAudio.pause();
            titleAudio.currentTime = 0;
        }

        function showMainMenu() {
            stopAllAudio();
            clearIntervals();
            nightActive = false;
            isPaused = false;
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('main-menu').style.display = 'flex';
            playTitleMusic();
        }

        function startGame() {
            initAudio();
            currentNight = 1;
            setupNightScreen();
        }

        function setupNightScreen() {
            stopAllAudio();
            nightActive = false;
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('night-title').innerText = `NOCHE ${currentNight}`;
            const subtitle = document.getElementById('night-subtitle');
            if (lastNightResult === 'over') {
                subtitle.innerText = 'Has caído... pero la noche continúa. Inténtalo de nuevo.';
            } else if (currentNight > 1) {
                subtitle.innerText = `Sobreviviste a la noche ${currentNight - 1}. La actividad aumenta.`;
            } else {
                subtitle.innerText = '';
            }
            document.getElementById('night-screen').style.display = 'flex';
        }

        function retryNight() {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            startNight();
        }

        function startNight() {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            
            power = 100;
            gameTime = 0;
            doors = { left: false, right: false };
            isTabletOpen = false;
            isFlashlightOn = false;
            activeLightSide = null;
            lastSpottedEnemy = false;
            currentCam = '1A';
            isPaused = false;
            nightActive = true;
            lastNightResult = null;
            
            updateDoorUI();
            document.getElementById('left-door-overlay').classList.remove('lit');
            document.getElementById('right-door-overlay').classList.remove('lit');
            document.getElementById('btn-light-left').classList.remove('active');
            document.getElementById('btn-light-right').classList.remove('active');
            document.getElementById('camera-system').style.display = 'none';
            document.getElementById('power-display').innerText = '100%';
            document.getElementById('power-bar-fill').style.width = '100%';
            document.getElementById('power-bar-fill').style.background = 'var(--green)';
            document.getElementById('time-display').innerText = '12 AM';

            bgAudio.currentTime = 0;
            bgAudio.play().catch(() => {});

            // Dificultad progresiva: la IA sube con la noche (tope 20) y cada animatronic
            // conserva su personalidad relativa. A diferencia de antes, los 3 arrancan ya
            // con una IA base desde la Noche 1 para que se muevan desde el minuto uno,
            // en vez de quedarse pegados a la sala inicial durante varios minutos.
            animatronics[0].ai = Math.min(20, currentNight + 2);
            animatronics[1].ai = Math.min(20, currentNight + 1);
            animatronics[2].ai = Math.min(20, currentNight + 3);

            animatronics.forEach(anim => {
                anim.location = anim.home;
                anim.pathIndex = 0;
                anim.doorTime = 0;
                anim.idleTicks = 0;
            });

            clearIntervals();
            gameIntervals.push(setInterval(updateClock, 60000)); 
            gameIntervals.push(setInterval(consumePower, 1000)); 
            gameIntervals.push(setInterval(gameLoop, 5000));
            
            updateCameraDisplay();
            updateCamActivityDots();
        }

        function clearIntervals() {
            gameIntervals.forEach(i => clearInterval(i));
            gameIntervals = [];
        }

        function stopAllAudio() {
            bgAudio.pause();
            titleAudio.pause();
            titleAudio.currentTime = 0;
            sorpresaAudio.pause();
            cocinaAudio.pause();
            sorpresaAudio.currentTime = 0;
            cocinaAudio.currentTime = 0;
            [audio1, audio2, audio3].forEach(a => {
                a.pause();
                a.currentTime = 0;
            });
        }

        function togglePause() {
            if (!nightActive) return;
            isPaused = !isPaused;
            if (isPaused) {
                clearIntervals();
                bgAudio.pause();
                cocinaAudio.pause();
                document.getElementById('pause-screen').style.display = 'flex';
            } else {
                document.getElementById('pause-screen').style.display = 'none';
                bgAudio.play().catch(() => {});
                const isAnyInKitchen = animatronics.some(a => a.location === 'C2');
                if (isAnyInKitchen) cocinaAudio.play().catch(() => {});
                clearIntervals();
                gameIntervals.push(setInterval(updateClock, 60000));
                gameIntervals.push(setInterval(consumePower, 1000));
                gameIntervals.push(setInterval(gameLoop, 5000));
            }
        }

        function updateClock() {
            gameTime++;
            if (gameTime >= 6) {
                clearIntervals();
                stopAllAudio();
                nightActive = false;
                if (currentNight < 5) {
                    currentNight++;
                    lastNightResult = 'won-night';
                    setupNightScreen();
                } else {
                    lastNightResult = 'won';
                    document.getElementById('end-title').innerText = '¡HAS SOBREVIVIDO LAS 5 NOCHES!';
                    document.getElementById('end-subtitle').innerText = '';
                    document.getElementById('retry-btn').style.display = 'none';
                    document.getElementById('end-screen').style.display = 'flex';
                }
            } else {
                document.getElementById('time-display').innerText = `${gameTime} AM`;
            }
        }

        function consumePower() {
            // El consumo base sube ligeramente con cada noche para escalar la dificultad.
            const nightMultiplier = 1 + (currentNight - 1) * 0.06;
            let usage = 0.15;
            if (doors.left) usage += 0.35;
            if (doors.right) usage += 0.35;
            if (isTabletOpen) usage += 0.25;
            if (isFlashlightOn) usage += 0.25;
            usage *= nightMultiplier;

            power -= usage;
            if (power <= 0) {
                power = 0;
                triggerPowerOutage();
            }
            const pct = Math.max(0, Math.ceil(power));
            document.getElementById('power-display').innerText = `${pct}%`;
            const fill = document.getElementById('power-bar-fill');
            fill.style.width = `${pct}%`;
            fill.style.background = pct <= 20 ? 'var(--red)' : (pct <= 50 ? 'var(--amber)' : 'var(--green)');
        }

        function triggerPowerOutage() {
            clearIntervals();
            stopAllAudio();
            doors.left = false;
            doors.right = false;
            isTabletOpen = false;
            isFlashlightOn = false;
            activeLightSide = null;
            lastSpottedEnemy = false;
            document.getElementById('camera-system').style.display = 'none';
            document.getElementById('left-door-overlay').classList.remove('lit');
            document.getElementById('right-door-overlay').classList.remove('lit');
            document.getElementById('btn-light-left').classList.remove('active');
            document.getElementById('btn-light-right').classList.remove('active');
            updateDoorUI();

            // En vez de culpar siempre al primer animatronic (bug original), ataca el que
            // esté más cerca de la oficina; si ninguno está en la puerta, el más activo.
            const atDoor = animatronics.find(a => a.location === 'DOOR');
            const attacker = atDoor || animatronics.reduce((prev, curr) => (curr.ai > prev.ai ? curr : prev), animatronics[0]);

            setTimeout(() => {
                triggerJumpscare(attacker);
            }, 3000);
        }

        function gameLoop() {
            let movedAny = false;
            animatronics.forEach(anim => {
                // Bono de "impaciencia": cada vuelta que pasa sin moverse suma puntos extra
                // a su dado, así ningún animatronic se queda pegado a una sala eternamente,
                // igual que en el FNAF real nadie se pasa la noche entera sin actuar.
                const impatienceBonus = Math.floor(anim.idleTicks / 2);
                const effectiveAi = Math.min(20, anim.ai + impatienceBonus);

                let roll = Math.floor(Math.random() * 20) + 1;
                let changed = false;
                if (roll <= effectiveAi) {
                    changed = moveAnimatronic(anim);
                }

                if (changed) {
                    movedAny = true;
                    anim.idleTicks = 0;
                } else {
                    anim.idleTicks++;
                }
            });

            // CONTROL DE SONIDO DE COCINA
            const isAnyInKitchen = animatronics.some(a => a.location === 'C2');
            if (isAnyInKitchen) {
                if (cocinaAudio.paused) cocinaAudio.play().catch(() => {});
            } else {
                cocinaAudio.pause();
                cocinaAudio.currentTime = 0;
            }

            if (movedAny) {
                triggerStaticFlash();
                updateCameraDisplay();
                updateCamActivityDots();
            }
            updateDoorViews();
        }

        // Cada animatronic recorre ÚNICAMENTE su propio camino (anim.path), sala por sala,
        // en vez de elegir al azar entre todas las salas del mapa. Esto es lo que hace que
        // el comportamiento se sienta "lógico": Img1 siempre pasa por baños antes de llegar
        // a su pasillo, Img2 siempre baja por la cocina, Img3 siempre sale de la cala pirata.
        function moveAnimatronic(anim) {
            if (anim.location === 'DOOR') {
                if (doors[anim.door]) {
                    // La puerta que le corresponde está cerrada: no puede pasar, vuelve a su casa.
                    anim.location = anim.home;
                    anim.pathIndex = 0;
                    anim.doorTime = 0;
                    return true;
                } else {
                    anim.doorTime += 5;
                    if (anim.doorTime >= 5) {
                        triggerJumpscare(anim);
                    }
                    return false;
                }
            }

            const nextIndex = anim.pathIndex + 1;
            const nextRoom = anim.path[nextIndex];
            if (!nextRoom) return false; // ya está al final de su ruta

            // No avanza a una sala ya ocupada por otro animatronic (evita que se amontonen).
            if (nextRoom !== 'DOOR' && animatronics.some(other => other.id !== anim.id && other.location === nextRoom)) {
                return false;
            }

            anim.pathIndex = nextIndex;
            anim.location = nextRoom;
            if (nextRoom === 'DOOR') anim.doorTime = 0;
            return true;
        }

        function triggerJumpscare(anim) {
            clearIntervals();
            stopAllAudio();
            nightActive = false;
            lastNightResult = 'over';
            
            anim.audio.currentTime = 0;
            anim.audio.play().catch(() => {});

            const jsDiv = document.getElementById('jumpscare');
            const jsImg = document.getElementById('jumpscare-img');
            jsImg.src = anim.sprite;
            jsDiv.style.display = 'flex';

            setTimeout(() => {
                jsDiv.style.display = 'none';
                document.getElementById('end-title').innerText = 'GAME OVER';
                document.getElementById('end-subtitle').innerText = `${anim.name} te encontró en la noche ${currentNight}.`;
                document.getElementById('retry-btn').style.display = 'inline-block';
                document.getElementById('end-screen').style.display = 'flex';
            }, 2500);
        }

        function toggleDoor(side) {
            if (power <= 0 || isPaused || !nightActive) return;
            doors[side] = !doors[side];
            playDoorSound();
            updateDoorUI();

            if (doors[side]) {
                animatronics.forEach(anim => {
                    if (anim.location === 'DOOR' && anim.door === side) {
                        anim.location = anim.home;
                        anim.pathIndex = 0;
                        anim.doorTime = 0;
                        anim.idleTicks = 0;
                        triggerStaticFlash();
                        updateCameraDisplay();
                        updateDoorViews();
                    }
                });
            }
        }

        function updateDoorUI() {
            document.getElementById('left-door-view').classList.toggle('closed', doors.left);
            document.getElementById('right-door-view').classList.toggle('closed', doors.right);

            document.getElementById('btn-door-left').classList.toggle('active', doors.left);
            document.getElementById('btn-door-right').classList.toggle('active', doors.right);
        }

        function handleLight(state, side) {
            if (isPaused || !nightActive) return;
            if (power <= 0) return;
            if (state !== isFlashlightOn) playLightSound();
            isFlashlightOn = state;
            activeLightSide = state ? side : null;
            
            if (!state) lastSpottedEnemy = false;

            const leftOverlay = document.getElementById('left-door-overlay');
            const rightOverlay = document.getElementById('right-door-overlay');

            leftOverlay.classList.toggle('lit', state && side === 'left');
            rightOverlay.classList.toggle('lit', state && side === 'right');

            document.getElementById('btn-light-left').classList.toggle('active', state && side === 'left');
            document.getElementById('btn-light-right').classList.toggle('active', state && side === 'right');

            updateDoorViews();
        }

        function updateDoorViews() {
            const leftImg = document.getElementById('left-enemy-img');
            const rightImg = document.getElementById('right-enemy-img');

            leftImg.style.display = 'none';
            rightImg.style.display = 'none';

            let enemySpottedNow = false;

            if (isFlashlightOn && activeLightSide) {
                animatronics.forEach(anim => {
                    if (anim.location === 'DOOR' && anim.door === activeLightSide) {
                        enemySpottedNow = true;
                        if (activeLightSide === 'left') {
                            leftImg.src = anim.sprite;
                            leftImg.dataset.size = anim.size;
                            leftImg.style.display = 'block';
                        } else if (activeLightSide === 'right') {
                            rightImg.src = anim.sprite;
                            rightImg.dataset.size = anim.size;
                            rightImg.style.display = 'block';
                        }
                    }
                });
            }

            if (enemySpottedNow && !lastSpottedEnemy) {
                sorpresaAudio.currentTime = 0;
                sorpresaAudio.play().catch(() => {});
                lastSpottedEnemy = true;
            } else if (!enemySpottedNow) {
                lastSpottedEnemy = false;
            }
        }

        function toggleTablet() {
            if (power <= 0 || isPaused || !nightActive) return;
            isTabletOpen = !isTabletOpen;
            
            if (isTabletOpen) {
                openAudio.currentTime = 0;
                openAudio.play().catch(() => {});
                document.getElementById('camera-system').style.display = 'block';
                triggerStaticFlash();
                updateCameraDisplay();
                updateCamActivityDots();
            } else {
                closeAudio.currentTime = 0;
                closeAudio.play().catch(() => {});
                document.getElementById('camera-system').style.display = 'none';
            }
        }

        function changeCam(camName) {
            if (isPaused || !nightActive) return;
            if (currentCam !== camName) {
                changeAudio.currentTime = 0;
                changeAudio.play().catch(() => {});
            }
            currentCam = camName;
            document.querySelectorAll('.cam-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`btn-${camName.toLowerCase()}`).classList.add('active');
            triggerStaticFlash();
            updateCameraDisplay();
        }

        function updateCameraDisplay() {
            const camSystem = document.getElementById('camera-system');
            const audioOnlyMsg = document.getElementById('audio-only-msg');
            const camImg = document.getElementById('cam-enemy-img');

            if (currentCam === 'C2') {
                camSystem.style.backgroundImage = 'none';
                camSystem.style.backgroundColor = '#000';
                audioOnlyMsg.style.display = 'block';
                camImg.style.display = 'none';
            } else {
                camSystem.style.backgroundImage = `url('${camBackgrounds[currentCam]}')`;
                audioOnlyMsg.style.display = 'none';

                const present = animatronics.find(a => a.location === currentCam);
                if (present) {
                    camImg.src = present.sprite;
                    camImg.dataset.size = present.size;
                    camImg.style.display = 'block';
                } else {
                    camImg.style.display = 'none';
                }
            }

            document.getElementById('cam-name').innerText = `CAM ${currentCam}`;
        }

        // Marca con un punto rojo las cámaras donde hay actividad, para dar
        // información útil de un vistazo al mapa sin tener que rotar por todas.
        function updateCamActivityDots() {
            CAM_LIST.forEach(cam => {
                const btn = document.getElementById(`btn-${cam.toLowerCase()}`);
                if (!btn) return;
                const occupied = animatronics.some(a => a.location === cam);
                btn.classList.toggle('has-activity', occupied);
            });
        }

        // --- ESCALADO RESPONSIVE DEL TABLERO ---
        function resizeGame() {
            const container = document.getElementById('game-container');
            const scale = Math.min(window.innerWidth / 1000, window.innerHeight / 600, 1);
            container.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        // --- CONTROLES DE TECLADO ---
        const camKeyMap = { '1': '1A', '2': '1B', '3': '1C', '4': 'C1', '5': '2A', '6': '2B', '7': '2P', '8': 'C2' };

        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            if (e.key === 'Escape') {
                if (nightActive) togglePause();
                return;
            }
            if (!nightActive || isPaused) return;

            if (camKeyMap[e.key] && isTabletOpen) {
                changeCam(camKeyMap[e.key]);
            } else if (e.key === 'a' || e.key === 'A') {
                toggleDoor('left');
            } else if (e.key === 'd' || e.key === 'D') {
                toggleDoor('right');
            } else if (e.key === 'Tab' || e.key === 'm' || e.key === 'M') {
                e.preventDefault();
                toggleTablet();
            } else if (e.key === 'q' || e.key === 'Q') {
                handleLight(true, 'left');
            } else if (e.key === 'e' || e.key === 'E') {
                handleLight(true, 'right');
            }
        });

        document.addEventListener('keyup', (e) => {
            if (!nightActive || isPaused) return;
            if (e.key === 'q' || e.key === 'Q') {
                handleLight(false, 'left');
            } else if (e.key === 'e' || e.key === 'E') {
                handleLight(false, 'right');
            }
        });

        // --- SONIDO DE CLICK EN BOTONES DEL MENÚ ---
        document.querySelectorAll('.menu-btn').forEach(btn => {
            btn.addEventListener('click', playClickSound);
        });

        // --- MÚSICA DE LA PANTALLA DE TÍTULO ---
        // Se intenta reproducir al cargar; si el navegador bloquea el autoplay con sonido,
        // arranca en cuanto el usuario interactúe por primera vez con la página.
        window.addEventListener('load', () => {
            if (!nightActive) playTitleMusic();
        });

        function unlockTitleMusicOnce() {
            if (!nightActive && titleAudio.paused) {
                playTitleMusic();
            }
        }
        document.addEventListener('pointerdown', unlockTitleMusicOnce, { once: true });
        document.addEventListener('keydown', unlockTitleMusicOnce, { once: true });
    </script>
</body>
